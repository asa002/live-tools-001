<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stream Week</title>
<meta name="description" content="配信者向け 週間配信スケジュール作成アプリ">
<meta name="theme-color" content="#121019">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stream Week">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+JP:wght@500;900&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;800&family=Rajdhani:wght@600;700&family=Yusei+Magic&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;900&family=Kosugi+Maru&family=RocknRoll+One&family=Reggae+One&family=Hachi+Maru+Pop&family=Mochiy+Pop+One&family=Kaisei+Decol:wght@400;700&family=Shippori+Mincho:wght@500;800&family=Kiwi+Maru:wght@400;500&family=Montserrat:wght@500;800&family=Poppins:wght@500;700&family=Pacifico&display=swap">
<style>
/* Layout: preview stage (left, sticky) + tabbed control desk (right). Phones stack them, stage stays pinned & collapsible. */
:root{
  --bg:#121019; --surface:#1a1723; --surface-2:#242030; --line:#352f45; --fg:#ece8f6; --muted:#a29cb8;
  --accent:#ff4f8b; --accent-ink:#ffffff; --sub:#5ad1ff; --warn:#ffb648; --ok:#57e0a5; --bad:#ff6b6b;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Outfit","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-logo:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --r:12px; --top-h:58px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f2f9; --surface:#ffffff; --surface-2:#eeebf6; --line:#dcd6ea; --fg:#1d1828; --muted:#6a6380;
    --accent:#e0336f; --accent-ink:#ffffff; --sub:#0d86b8; --warn:#b86e00; --ok:#138a5a; --bad:#cc2f3b; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f4f2f9; --surface:#ffffff; --surface-2:#eeebf6; --line:#dcd6ea; --fg:#1d1828; --muted:#6a6380;
  --accent:#e0336f; --accent-ink:#ffffff; --sub:#0d86b8; --warn:#b86e00; --ok:#138a5a; --bad:#cc2f3b; color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--f-ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;height:var(--top-h);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.logo b{font:400 19px/1 var(--f-logo);letter-spacing:.02em;white-space:nowrap}
.tally{display:inline-flex;align-items:center;gap:6px;font:700 10px/1 var(--f-num);letter-spacing:.14em;color:var(--accent);border:1.5px solid var(--accent);border-radius:4px;padding:4px 6px}
.tally::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sub);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media (max-width:620px){ .top{gap:6px} .top .btn .lbl{display:none} .top .btn{padding:0 10px} .logo .tally{display:none} }

/* main grid */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,460px);gap:20px;align-items:start;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:10px;min-width:0}
.canvas-box{display:flex;justify-content:center;align-items:center;background:
  repeating-conic-gradient(var(--surface) 0 25%, var(--surface-2) 0 50%) 0 0/18px 18px;border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow:hidden}
#cv{cursor:pointer;display:block;max-width:100%;max-height:calc(100vh - var(--top-h) - 150px);width:auto;height:auto;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.stage-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.meta{font:600 12px/1.2 var(--f-num);color:var(--muted);letter-spacing:.06em}
.chip-warn{font-size:12px;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:2px 10px}
.quick{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.quick button{width:40px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.quick button[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2)}
.mini{display:block;position:relative;border:1.5px solid var(--muted);border-radius:2px;background:transparent}
.mini.l{width:24px;height:14px}.mini.p{width:11px;height:19px}
.mini i{position:absolute;background:var(--fg);opacity:.75;border-radius:1px}
.mini u{position:absolute;background:var(--accent);opacity:.55;border-radius:1px}
[aria-pressed="true"] .mini{border-color:var(--accent)}
.collapse-btn{display:none}
.panel > .tabs.in-stage{display:none}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .stage{z-index:20;top:calc(var(--top-h) + env(safe-area-inset-top,0px));background:var(--bg);padding-block:10px 8px;margin-top:-16px;border-bottom:1px solid var(--line)}
  #cv{max-height:27vh}
  .stage.small #cv{max-height:14vh}
  .stage.hide .canvas-box{display:none}
  .collapse-btn{display:inline-flex}
  .quick{margin-left:0}
  .stage .tabs.in-stage{position:static;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px}
  .canvas-box{padding:6px}
}
@media (max-width:620px){
  .logo{flex:1 1 auto;min-width:0;margin-right:0}
  .logo b{font-size:15px;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .top .btn{min-height:36px;padding:0 8px;border-radius:9px}
  .top #btnInstall{display:none}
  .hist{gap:2px}
  .meta{display:none}
  .stage-bar{gap:6px;flex-wrap:nowrap}
  .quick button{width:34px;height:28px}
  .quick .mini.l{width:20px;height:12px}.quick .mini.p{width:10px;height:16px}
  .collapse-btn{margin-left:auto;padding:0 8px}
  .drag-hint{display:none}
  .chip-warn{display:none}
}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:6px;border-bottom:1px solid var(--line);position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));background:var(--surface);z-index:5;border-radius:var(--r) var(--r) 0 0}
@media (max-width:900px){ .tabs{position:static} }
@media (max-width:520px){ .tabs{display:flex;overflow-x:auto;scrollbar-width:none} .tab{flex:0 0 auto;padding:9px 12px;font-size:13px} }
.avsub{margin-top:2px}.avsub button{flex:1 1 18%;padding:8px 4px;font-size:12.5px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:16px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);cursor:pointer;text-align:center}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--surface-2)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{max-height:110px;max-width:60%;object-fit:contain;border-radius:6px}
.drop b{font-size:15px}.drop span{font-size:12px;color:var(--muted)}
.tips{margin:0;padding-left:1.2em;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}.tips b{color:var(--fg)}
.avsize{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;gap:8px;align-items:center}
.avsize .range-row{grid-template-columns:4.8em minmax(0,1fr) 3.4em;white-space:nowrap}
.zb{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:700;cursor:pointer;line-height:1}
.zb:hover{border-color:var(--accent)}
.nudge{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.nlab{font-size:13px;min-width:7em}
.pad{display:grid;grid-template-columns:repeat(4,38px);gap:4px}
.cropbox{display:flex;justify-content:center;background:repeating-conic-gradient(#d9d6e2 0 25%,#ffffff 0 50%) 0 0/14px 14px;border:1px solid var(--line);border-radius:10px;padding:8px}
#avCrop{display:block;max-width:100%;touch-action:none;cursor:crosshair}
.sub-h{font-size:12.5px;font-weight:700;color:var(--fg);margin-top:4px}
.urow{display:grid;grid-template-columns:22px 112px minmax(0,1fr) 34px;gap:6px;align-items:center}
@media (max-width:480px){.urow{grid-template-columns:22px minmax(0,1fr) 34px}.urow input[type=url]{grid-column:1/-1;grid-row:2}}
.tagchip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.tagchip button{border:0;background:transparent;padding:5px 9px;cursor:pointer;font:600 13px var(--f-ui);color:var(--muted)}
.tagchip button+button{padding:5px 9px 5px 2px;font-size:14px}
.tagchip.on{border-color:var(--sub);background:var(--surface-2)}.tagchip.on button:first-child{color:var(--fg)}
.hol{font-size:10.5px;color:var(--bad);font-weight:700}
.wkcs{display:flex;flex-wrap:wrap;gap:10px}.wkc{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.wkc span{font-weight:700;font-size:13px}.wkc em,.drow em{font-style:normal;font-size:10px;color:var(--muted)}
.mini-reset{border:0;background:transparent;color:var(--sub);font-size:10px;cursor:pointer;padding:0}
.wkrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto 34px;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.wkrow.cur{border-color:var(--accent)}.wkrow b{font:700 14px var(--f-num)}
@media (max-width:480px){.wkrow{grid-template-columns:auto minmax(0,1fr) auto 34px}.wkrow > .hint:nth-of-type(1){grid-column:1/-1;grid-row:2}}
.wk-tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;border:1px solid currentColor}.wk-tag.now{color:var(--accent)}.wk-tag.past{color:var(--muted)}.wk-tag.future{color:var(--sub)}
.fdet{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}.fdet summary{cursor:pointer;font-weight:700;font-size:13px}
.froles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:8px 0}
.sprow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.sprow:not(.on){grid-template-columns:1fr}.sprow.on{border-color:var(--accent)}
@media (max-width:520px){.sprow.on{grid-template-columns:1fr 1fr}.sprow.on>label:first-child{grid-column:1/-1}}
.flash{animation:flash 1.4s ease-out}@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.pf{border-radius:10px;padding:10px 12px;font-size:13px}.pf ul{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.pf.warn{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}.pf.ok{border:1px solid var(--ok);color:var(--ok)}
.dialog .hint{white-space:pre-line}
.qrsend{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.qrsend{grid-template-columns:1fr}}
#qrCv{width:100%;height:auto;border-radius:10px;background:#fff;image-rendering:pixelated}
.qrinfo{display:flex;flex-direction:column;gap:10px}.qrinfo .field{flex:none}.qrinfo b{font:800 22px var(--f-num)}
.scanbox{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:12%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.scanbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}#scanBar{height:100%;width:0;background:var(--accent);transition:width .2s}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.ico-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:11.5px;font-weight:700;color:var(--fg)}
.ico-btn img{width:56px;height:38px}.ico-btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.shrow{display:grid;grid-template-columns:6.2em minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.shrow b{font:700 13px var(--f-num)}
.avprev{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.avprev figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.avprev figcaption{font-size:11.5px;color:var(--muted)}
.avprev canvas{width:100%;height:170px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:repeating-conic-gradient(#d9d6e2 0 25%,#ffffff 0 50%) 0 0/14px 14px}

.tab{border:0;background:transparent;padding:9px 2px;white-space:nowrap;border-radius:8px;cursor:pointer;font-weight:700;color:var(--muted);font-size:13.5px}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.body{padding:14px;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.grp:last-child{border-bottom:0;padding-bottom:0}
.grp h3{margin:0;font-size:13px;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:8px}
.grp h3 .en{font:600 10px/1 var(--f-num);letter-spacing:.16em;opacity:.7}
.hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.hint b{color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > *{min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}
.field > span{font-size:12px;color:var(--muted)}
input[type=text],input[type=time],input[type=date],input[type=url],select,textarea{width:100%;min-height:38px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:15px}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input[type=time]{font-family:var(--f-num);font-weight:600;letter-spacing:.03em;min-width:0}
input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:700;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.grp > .field{flex:none}
input[type=time]::-webkit-calendar-picker-indicator{margin:0;padding:0;width:14px;opacity:.6}
input[type=time]::-webkit-datetime-edit{padding:0}
.range-row{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:13px}
.range-row output{font:600 12px var(--f-num);color:var(--muted);text-align:right}

/* schedule tab */
.weekbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;align-items:center}
.weekpick{position:relative;display:flex;align-items:center;justify-content:center;min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font:700 15px var(--f-num);letter-spacing:.04em;cursor:pointer;overflow:hidden}
.weekpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.day{border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px}
.day.off{opacity:.92}
.day-h{display:flex;align-items:center;gap:8px;position:sticky;top:var(--stick,0px);z-index:4;background:var(--bg);margin:-10px -10px 0;padding:10px 10px 6px;border-radius:11px 11px 0 0}
.day input,.day select,.day textarea{scroll-margin-top:calc(var(--stick,0px) + 64px);scroll-margin-bottom:24px}
.grp input,.grp select{scroll-margin-top:calc(var(--stick,0px) + 16px)}
.dchip{display:inline-flex;align-items:baseline;gap:6px;font:800 16px/1 var(--f-num);padding:6px 9px;border-radius:7px;background:var(--dc,#888);color:var(--dci,#fff)}
.dchip small{font:700 11px/1 var(--f-ui)}
.day-h .wd{font-weight:700;color:var(--muted);font-size:12.5px}
.day-h .check{margin-left:auto;font-size:13px}
.slot{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.slot-top{display:grid;grid-template-columns:minmax(70px,.8fr) minmax(0,1.1fr) minmax(0,1.1fr) 34px;gap:6px;align-items:end}
@media (max-width:560px){.slot-top{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}.slot-top .tt:first-child{grid-column:1/3}.slot-top .x{grid-column:3;grid-row:1}.slot-top .tt input[type=time]{font-size:16px;padding:6px 8px}}
.tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tt > span{font:700 10.5px/1.2 var(--f-num);letter-spacing:.08em;color:var(--muted)}
.tt.b > span{color:var(--sub)}
.tt small{font-size:10.5px;color:var(--warn);line-height:1.2;min-height:1.2em}
.slot-head.three{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) 34px}
.slot-head{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px;align-items:center}
.times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.times.one{grid-template-columns:minmax(0,1fr)}
.tzb{display:flex;flex-direction:column;gap:2px;min-width:0}
.tzb > span{font:700 10.5px/1.2 var(--f-num);letter-spacing:.08em;color:var(--muted)}
.tzb.b > span{color:var(--sub)}
.tzb small{font-size:10.5px;color:var(--muted);line-height:1.2;min-height:1.2em}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px;align-items:center}
.pair i{font-style:normal;color:var(--muted)}
.pair input[type=time]{padding:6px 6px;font-size:14.5px}
@media (max-width:560px){.times{grid-template-columns:minmax(0,1fr)} .pair input[type=time]{font-size:16px}}
.stage.dragbg #cv{cursor:grab;touch-action:none}
.stage.dragbg #cv:active{cursor:grabbing}
.drag-hint{font-size:12px;color:var(--sub)}
.slot-ti{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.slot-ti.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.x{width:34px;height:38px;border-radius:9px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.x:hover{color:var(--bad);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;font:600 13px var(--f-num);color:var(--fg)}
.chipbtn i{width:8px;height:8px;border-radius:50%;background:var(--c,#888);flex:none}
.chipbtn:hover{border-style:solid;border-color:var(--accent)}
.chipbtn[disabled]{opacity:.4;cursor:not-allowed}

/* design tab */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.pal{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.pal[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pal .sw{display:flex;height:16px;border-radius:4px;overflow:hidden}
.pal .sw i{flex:1}
.pal span{font-size:12px;font-weight:700}
.drow{display:grid;grid-template-columns:4.2em repeat(4,auto) minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
.drow .dn{font:800 13px var(--f-num)}
.drow label{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);gap:2px}
.drow .tools{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.cr{font:700 11px var(--f-num);padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.cr.good{color:var(--ok)}.cr.mid{color:var(--warn)}.cr.bad{color:var(--bad)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font:700 13px var(--f-num);letter-spacing:.02em}
.thumb{width:44px;height:28px;border-radius:5px;border:1px solid var(--line);object-fit:cover;background:var(--surface-2)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* layout tab */
.lays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lay{border:1px solid var(--line);border-radius:10px;padding:10px 6px 8px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700}
.lay[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lay .mini.l{width:64px;height:36px}.lay .mini.p{width:30px;height:52px}

/* tags / presets */
.list{display:flex;flex-direction:column;gap:6px}
.accs{display:flex;flex-wrap:wrap;gap:6px}
.acc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;background:var(--bg);font:700 13px inherit;cursor:pointer;color:var(--muted)}
.acc::before{content:'';width:15px;height:15px;border-radius:5px;border:2px solid currentColor;box-sizing:border-box;flex:none}
.acc[aria-pressed="true"]{color:var(--fg);border-color:var(--accent)}
.acc[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--bg)}
.sortl{display:flex;flex-direction:column;gap:6px}
.sorti{display:grid;grid-template-columns:34px 22px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);user-select:none;-webkit-user-select:none}
.sorti .hd{cursor:grab;touch-action:none;font-size:20px;line-height:1;color:var(--muted);text-align:center;padding:6px 0;border-radius:8px}
.sorti .hd:hover{background:var(--surface)}
.sorti .n{font-weight:800;color:var(--accent);text-align:center}
.sorti small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.sorti .mv{display:flex;gap:4px}.sorti .mv button{width:30px;height:30px;padding:0}
.sorti.drag{box-shadow:0 8px 22px rgba(0,0,0,.28);border-color:var(--accent);position:relative;z-index:3;cursor:grabbing}
.sortl.dragging .sorti:not(.drag){transition:transform .12s}
.geo{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.trow{display:grid;grid-template-columns:40px minmax(0,1fr) 92px 34px;gap:6px;align-items:center}
.trow .pill{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr) 34px;grid-template-areas:"t s e x" "g g ti ti" "all all all all";gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.prow .pt1{grid-area:t}.prow .tsep{grid-area:s;text-align:center;color:var(--muted)}.prow .pt2{grid-area:e}.prow .x{grid-area:x}.prow .psel{grid-area:g}.prow .pt{grid-area:ti}.prow .pall{grid-area:all}
@media (max-width:420px){.prow{grid-template-areas:"t s e x" "g g g g" "ti ti ti ti" "all all all all"}}
.pill{display:inline-flex;align-items:center;font:800 12px/1 var(--f-num);padding:6px 9px;border-radius:999px;white-space:nowrap}

/* share tab */
.qr{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qr .code{background:#fff;padding:8px;border-radius:10px;line-height:0}
.qr .code svg{width:180px;height:180px}
.count{font:600 12px var(--f-num);color:var(--muted);text-align:right}
.count.over{color:var(--bad)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:13.5px}

/* modal, toast */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(8,6,14,.62);padding:16px}
.dialog.wide{width:min(920px,100%)}
.hist{display:flex;gap:4px}.btn.ico{padding:0 9px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.slot-card{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.slot-card.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slot-card .th{aspect-ratio:16/9;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font:700 12px var(--f-num);letter-spacing:.1em}
.slot-card .th img{width:100%;height:100%;object-fit:contain;background:#00000010}
.slot-card .meta2{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.slot-card .no{font:800 11px var(--f-num);color:var(--muted);letter-spacing:.1em}
.slot-card input{min-height:32px;font-size:13px;padding:4px 8px}
.slot-card .when{font-size:11px;color:var(--muted)}
.slot-card .acts2{display:flex;flex-wrap:wrap;gap:4px}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.starter{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0;cursor:pointer;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.starter[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.starter img{width:100%;aspect-ratio:16/9;object-fit:contain;background:var(--surface-2)}
.starter span{padding:6px 8px;font-size:12.5px;font-weight:700}
.dialog{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dialog h2{margin:0;font-size:17px}
.dialog .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.dialog img.result{width:100%;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion: no-preference){ .toast{animation:pop .18s ease-out} @keyframes pop{from{transform:translate(-50%,8px);opacity:0}} }
</style>
</head>
<body>

  <div class="logo"><b>Stream Week</b><span class="tally">ON AIR</span></div>

  <button class="btn ghost" id="btnSlots" title="セーブスロット・新規作成"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><span class="lbl">スロット</span></button>

</header>

<main class="wrap">
  <section class="stage" id="stage" aria-label="プレビュー">

function updateSpec(){
  const sf=$('#specFrame'),sb=$('#specBg');if(!sf&&!sb)return;
  const{W,H}=dims();const c=LAST.card;if(!c)return;
  const g=(a,b)=>{const gg=(x,y)=>y?gg(y,x%y):x;const d=gg(Math.round(a),Math.round(b));return d};
  const w=Math.round(c.w);
  const sizes=c.hs.map(h=>`${w} × ${h} px <span style="color:var(--muted);font-weight:600">（${(w/h).toFixed(2)} : 1 ／ 2倍 ${w*2}×${h*2}）</span>`).join('<br>');

  if(sb)sb.innerHTML=`<dt>推奨サイズ</dt><dd>${W} × ${H} px（${W>H?'16:9':'9:16'}）</dd><dt>高画質（2倍）</dt><dd>${W*2} × ${H*2} px</dd>`;
}

function thumbDraw(cvs,src){if(!cvs)return;const x=cvs.getContext('2d');x.clearRect(0,0,cvs.width,cvs.height);if(!src)return;const sc=Math.min(cvs.width/src.width,cvs.height/src.height);const w=src.width*sc,h=src.height*sc;x.drawImage(src,(cvs.width-w)/2,(cvs.height-h)/2,w,h);cvs._map={sc,ox:(cvs.width-w)/2,oy:(cvs.height-h)/2,src}}

let CROPSTEP=0.5,CDRAG=null;
function cropRectPx(c){const C=S.avatar.crop;return{x0:c.width*C.l/100,y0:c.height*C.t/100,x1:c.width*(1-C.r/100),y1:c.height*(1-C.b/100)}}
function drawCropEditor(){
  const c=$('#avCrop');const im=IMG.avatar;if(!c||!im)return;
  const iw=im.naturalWidth,ih=im.naturalHeight;const W=600,H=Math.round(600*ih/iw);
  if(c.width!==W||c.height!==H){c.width=W;c.height=H;c.style.width=Math.min(1,380/H*W/W)*100+'%';c.style.maxWidth=(380*W/H)+'px';c.style.width='100%'}
  const x=c.getContext('2d');x.clearRect(0,0,W,H);x.drawImage(im,0,0,W,H);
  const r=cropRectPx(c);
  x.save();x.fillStyle='rgba(15,12,25,.55)';x.beginPath();x.rect(0,0,W,H);x.rect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);x.fill('evenodd');
  x.strokeStyle='#5ad1ff';x.lineWidth=2;x.strokeRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);
  x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=1;for(const f of[1/3,2/3]){x.beginPath();x.moveTo(r.x0+(r.x1-r.x0)*f,r.y0);x.lineTo(r.x0+(r.x1-r.x0)*f,r.y1);x.moveTo(r.x0,r.y0+(r.y1-r.y0)*f);x.lineTo(r.x1,r.y0+(r.y1-r.y0)*f);x.stroke()}
  const hs=cropHandles(r),k=c.width/c.getBoundingClientRect().width||1,sz=10*k;
  for(const[,hx,hy]of hs){x.fillStyle='#ffffff';x.fillRect(hx-sz/2,hy-sz/2,sz,sz);x.strokeStyle='#1478aa';x.lineWidth=1.5;x.strokeRect(hx-sz/2,hy-sz/2,sz,sz)}
  x.restore();
}
function cropHandles(r){const mx=(r.x0+r.x1)/2,my=(r.y0+r.y1)/2;return[['nw',r.x0,r.y0],['n',mx,r.y0],['ne',r.x1,r.y0],['e',r.x1,my],['se',r.x1,r.y1],['s',mx,r.y1],['sw',r.x0,r.y1],['w',r.x0,my]]}
function cropPt(c,e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*c.width/b.width,y:(e.clientY-b.top)*c.height/b.height,k:c.width/b.width}}
function setCrop(C){const m=5;C.l=clamp(C.l,0,95);C.r=clamp(C.r,0,95);C.t=clamp(C.t,0,95);C.b=clamp(C.b,0,95);
  if(C.l+C.r>100-m){C.r=100-m-C.l}if(C.t+C.b>100-m){C.b=100-m-C.t}
  for(const k of['l','r','t','b'])C[k]=Math.round(C[k]*100)/100;S.avatar.crop=C;}
function syncCropInputs(){for(const k of['t','b','l','r']){const el=document.getElementById('r-avatar-crop-'+k);if(el){el.value=S.avatar.crop[k];const o=el.parentElement.querySelector('output');if(o)o.textContent=(Math.round(S.avatar.crop[k]*10)/10)+'%'}}}
function cropChanged(final){schedule();drawCropEditor();syncCropInputs();if(final){if(S.avatar.autofit)fitAvatar();save();schedule();syncDragInputs();drawAvThumbs()}}
body.addEventListener('pointerdown',e=>{
  const c=e.target.closest('#avCrop');if(!c)return;e.preventDefault();c.setPointerCapture?.(e.pointerId);
  const p=cropPt(c,e),r=cropRectPx(c);let mode=null;
  for(const[n,hx,hy]of cropHandles(r))if(Math.abs(p.x-hx)<14*p.k&&Math.abs(p.y-hy)<14*p.k){mode=n;break}
  if(!mode&&p.x>r.x0&&p.x<r.x1&&p.y>r.y0&&p.y<r.y1)mode='move';
  if(!mode){mode='new'}
  CDRAG={mode,p0:p,c0:{...S.avatar.crop},W:c.width,H:c.height};
});
body.addEventListener('pointermove',e=>{
  if(!CDRAG)return;const c=$('#avCrop');if(!c)return;const p=cropPt(c,e);const D=CDRAG;
  const dx=(p.x-D.p0.x)/D.W*100,dy=(p.y-D.p0.y)/D.H*100;const C={...D.c0};const m=D.mode;
  if(m==='move'){const w=100-C.l-C.r,h=100-C.t-C.b;C.l=clamp(D.c0.l+dx,0,100-w);C.r=100-w-C.l;C.t=clamp(D.c0.t+dy,0,100-h);C.b=100-h-C.t}
  else if(m==='new'){const ax=D.p0.x/D.W*100,ay=D.p0.y/D.H*100,bx=p.x/D.W*100,by=p.y/D.H*100;C.l=Math.min(ax,bx);C.r=100-Math.max(ax,bx);C.t=Math.min(ay,by);C.b=100-Math.max(ay,by);if(100-C.l-C.r<2||100-C.t-C.b<2)return}
  else{
    if(m.includes('w'))C.l=D.c0.l+dx;if(m.includes('e'))C.r=D.c0.r-dx;if(m.includes('n'))C.t=D.c0.t+dy;if(m.includes('s'))C.b=D.c0.b-dy;
    if(e.shiftKey&&m.length===2){const ar=(100-D.c0.l-D.c0.r)*D.W/((100-D.c0.t-D.c0.b)*D.H);const w=100-C.l-C.r;const h=w*D.W/ar/D.H;if(m.includes('n'))C.t=100-C.b-h;else C.b=100-C.t-h}
  }
  setCrop(C);cropChanged(false);
});
const cropEnd=()=>{if(!CDRAG)return;CDRAG=null;cropChanged(true)};
body.addEventListener('pointerup',cropEnd);body.addEventListener('pointercancel',cropEnd);

const PLATFORMS=['YouTube','Twitch','ニコニコ','ツイキャス','Kick','TikTok','REALITY','ミラティブ','その他'];
const TAG_SUGGEST=['#配信予定','#VTuber','#新人VTuber','#Vtuber準備中','#ゲーム実況','#歌枠','#雑談配信','#耐久配信','#ENVtuber','#VTuberSchedule'];
const TPL={
  week:{ja:'【{title}】{range}\n\n{schedule}\n\n{url}\n\n{tags}',en:'{title} {range}\n\n{schedule}\n\n{url}\n\n{tags}'},
  compact:{ja:'{title} {range}\n{schedule}\n{url}\n{tags}',en:'{title} {range}\n{schedule}\n{url}\n{tags}'},
  today:{ja:'{name}{head} {date}\n\n{today}\n\n{url}\n\n{tags}',en:'{name}{head} {date}\n\n{today}\n\n{url}\n\n{tags}'},
};
function postLang(){return S.lang==='en'?'en':'ja'}
function postDayIdx(){if(S.post.day>=0)return S.post.day;const M=buildModel();const t=ymd(new Date());let s0=0;for(let i=0;i<7;i++){const d=dayDate(i);if(`${d.y}-${pad2(d.mo+1)}-${pad2(d.d)}`===t)s0=i}for(let i=s0;i<7;i++)if(M.days[i].hasTime)return i;const j=M.days.findIndex(d=>d.hasTime);return j<0?s0:j}
function postOpts(o){return{tpl:S.post.tpl,second:S.post.withSecond&&S.tz.b.on,end:S.post.withEnd,title:S.post.withTitle,off:S.post.withOff,...(o||{})}}
function genPost(o){
  o=postOpts(o);const M=buildModel(),L=postLang();const lab=x=>(x||'').replace(/[()]/g,'');const sep=L==='en'?'–':'〜';
  const dayLabel=d=>L==='en'?`${d.dt.mo+1}/${d.dt.d} (${WD_EN2[d.dt.dow]})`:`${d.dt.mo+1}/${d.dt.d}(${WD_JA[d.dt.dow]})`;
  const tiOf=it=>!o.title?'':(L==='en'?it.main:(it.main||it.sub));
  const timeTxt=it=>{if(it.tba)return it.p;let s=(o.end&&it.pe?it.ps+sep+it.pe:it.ps+(L==='en'?'':'〜'))+' '+lab(it.pl);
    if(o.second&&it.s2)s+=` / ${it.s2.pre?it.s2.pre+' ':''}${o.end&&it.s2.te?it.s2.ts+sep+it.s2.te:it.s2.ts} ${lab(it.s2.l)}`;return s};
  const sched=M.days.filter(d=>o.off||d.hasTime).map(d=>{
    if(o.tpl==='compact'){const parts=d.items.map(it=>it.kind!=='slot'?it.main:[it.tba?it.p:it.ps,tiOf(it)].filter(Boolean).join(' '));return dayLabel(d)+' '+parts.join(' / ')}
    const parts=d.items.map(it=>it.kind!=='slot'?it.main:[timeTxt(it),tiOf(it)].filter(Boolean).join(' '));
    return dayLabel(d)+' '+parts.join(' ／ ');
  }).join('\n');
  const tdi=postDayIdx(),td=M.days[tdi];const isToday=(()=>{const d=dayDate(tdi);return`${d.y}-${pad2(d.mo+1)}-${pad2(d.d)}`===ymd(new Date())})();
  const head=L==='en'?(isToday?'Going live today!':'Next stream!'):(isToday?'本日の配信です！':'次の配信のお知らせ！');
  const today=td?td.items.map(it=>it.kind!=='slot'?it.main:'▶ '+[timeTxt(it),tiOf(it)].filter(Boolean).join(' ')).join('\n'):'';
  const urls=S.post.urls.filter(u=>u.on&&u.url.trim()).map(u=>`▶ ${u.pf==='その他'?(L==='en'?'Stream':'配信'):u.pf}${L==='en'?': ':'：'}${u.url.trim()}`).join('\n');
  const tags=S.post.tags.filter(t=>t.on).map(t=>t.t).slice(0,o.tags||99).join(' ');
  const title=L==='en'?S.title.en:S.title.ja;
  const tpl=o.tpl==='custom'?(S.post.custom||TPL.week[L]):TPL[o.tpl]?TPL[o.tpl][L]:TPL.week[L];
  const map={title,range:M.range,schedule:sched,today,url:urls,tags,name:S.channel.trim()?S.channel.trim()+(L==='en'?' | ':' '):'',date:td?dayLabel(td):'',head};
  return tpl.replace(/\{(\w+)\}/g,(m,k)=>k in map?map[k]:m).replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function fitPost(){
  const z={second:false,off:false,end:false};
  const steps=[{},{second:false},{second:false,off:false},z];
  if(S.post.tpl!=='today'&&S.post.tpl!=='custom')steps.push({...z,tpl:'compact'},{...z,tpl:'compact',tags:3},{...z,tpl:'compact',tags:2});
  else steps.push({...z,tags:3},{...z,tags:2});
  steps.push({...z,title:false,tags:2});
  for(const st of steps){const t=genPost(st);if(xCount(t)<=280)return{t,st}}
  return{t:genPost(steps[steps.length-1]),st:null};
}
function addPostTag(){const inp=$('#ptagInput');if(!inp)return;const tags=inp.value.split(/[\s,、]+/).map(t=>t.trim()).filter(Boolean).map(t=>t.startsWith('#')||t.startsWith('＃')?'#'+t.slice(1):'#'+t);if(!tags.length)return;for(const t of tags)if(!S.post.tags.some(x=>x.t===t))S.post.tags.push({t,on:true});postDirty=false;changed(true);setTimeout(()=>$('#ptagInput')?.focus(),0)}
function refreshPost(){if(postDirty)return;postText=genPost();const ta=$('#postText');if(ta){ta.value=postText;updateCount()}}
function updateCount(){const ta=$('#postText'),c=$('#postCount');if(!ta||!c)return;const n=xCount(ta.value);c.textContent=n+' / 280';c.classList.toggle('over',n>280);const f=$('#btnFit');if(f)f.hidden=n<=280}

function fileName(){return`schedule_${S.weekStart}.png`}
async function makePng(){
  await ensureFonts();
  const{W,H}=dims(),sc=S.layout.scale;
  const c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;const ctx=c.getContext('2d');ctx.setTransform(sc,0,0,sc,0,0);

}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
let lastPngUrl='';
function avAABB(W,H){const b=avBox(W,H);if(!b)return null;const xs=b.co.map(c=>c.x),ys=b.co.map(c=>c.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}
function preflight(){
  const out=[];const{W,H}=dims();const res=LAST.res||{};
  if(res.small)out.push({msg:'予定の文字が小さくなっています。予定の数・タイトルを減らすか、見出しを小さくすると読みやすくなります。',tab:'layout'});
  if(res.trunc)out.push({msg:'長い配信タイトルが「…」で省略されています。',tab:'sched'});
  if(S.img.avatar&&S.avatar.on&&IMG.avatar&&LAST.block){const a=avAABB(W,H),b=LAST.block;if(a){const ix=Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x)),iy=Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
    if(ix*iy>a.w*a.h*0.06)out.push({msg:S.avatar.front?'アバターが予定の上に重なっています。':'アバターの一部が予定の後ろに隠れています。',tab:'avatar'});
    const vis=Math.max(0,Math.min(a.x+a.w,W)-Math.max(a.x,0))*Math.max(0,Math.min(a.y+a.h,H)-Math.max(a.y,0));if(vis<a.w*a.h*0.6)out.push({msg:'アバターの多くが画像の外にはみ出しています。',tab:'avatar'})}}
  const bad=S.days.map((d,i)=>contrast(d.c.t,d.c.f)<3&&S.style.alpha>=50?WD_JA[dowOf(i)]:'').filter(Boolean);
  if(bad.length)out.push({msg:`${bad.join('・')}曜日の文字の色が背景と近く、読みにくくなっています。`,tab:'design'});
  if(weekEmpty(packWeek()))out.push({msg:'この週の予定がまだ入っていません。',tab:'sched'});

const QRQ={std:{bg:1280,av:720,fr:540,jq:0.7,label:'標準（はやい）'},hi:{bg:1920,av:1080,fr:800,jq:0.8,label:'高画質（フルHD）'},uhd:{bg:3840,av:1600,fr:1200,jq:0.86,label:'4K（元の画質に近い）'}};
const QRSZ={s:{c:480,label:'読み取りやすさ優先'},m:{c:800,label:'ふつう'},l:{c:1150,label:'枚数を減らす'}};
const QR_G=8;

function hasAlpha(im){try{const c=document.createElement('canvas');c.width=48;c.height=48;const x=c.getContext('2d');x.drawImage(im,0,0,48,48);const d=x.getImageData(0,0,48,48).data;for(let o=3;o<d.length;o+=4)if(d[o]<245)return true}catch(e){}return false}
async function encImg(im,max,jq){
  const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height,sc=Math.min(1,max/Math.max(iw,ih));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(iw*sc));c.height=Math.max(1,Math.round(ih*sc));const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);

  let b=await new Promise(r=>c.toBlob(r,type,alpha?Math.min(0.92,jq+0.08):jq));
  if(!b||b.type!==type){b=await new Promise(r=>c.toBlob(r,alpha?'image/png':'image/jpeg',jq))}
  return b;
}
function qrHead(id,type,g,idx,n,total){const h=new Uint8Array(14),dv=new DataView(h.buffer);h[0]=0x57;h[1]=0x32;dv.setUint16(2,id);h[4]=type;h[5]=g;dv.setUint16(6,idx);dv.setUint16(8,n);dv.setUint32(10,total);return h}

async function buildTransfer(q,sz){
  const cfg=QRQ[q]||QRQ.std,C=(QRSZ[sz]||QRSZ.m).c;const metas=[],blobs=[];
  for(const k of imgKeys()){if(!hasImg(k)||!IMG[k])continue;const max=k==='bg'?cfg.bg:k==='avatar'?cfg.av:cfg.fr;const b=await encImg(IMG[k],max,cfg.jq);if(!b)continue;metas.push({k,type:b.type,len:b.size});blobs.push(new Uint8Array(await b.arrayBuffer()))}
  const head=new TextEncoder().encode(JSON.stringify({app:'stream-week',v:1,state:clone(S),imgs:metas}));
  const total=4+head.length+blobs.reduce((a,b)=>a+b.length,0);const buf=new Uint8Array(total);new DataView(buf.buffer).setUint32(0,head.length);buf.set(head,4);let o=4+head.length;for(const b of blobs){buf.set(b,o);o+=b.length}
  let pay;try{const z=new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());pay=new Uint8Array(z.length+1);pay[0]=0x7a;pay.set(z,1)}catch(e){pay=new Uint8Array(buf.length+1);pay[0]=0x72;pay.set(buf,1)}
  const id=(Math.random()*65535)|0,n=Math.ceil(pay.length/C),out=[];let dataN=0;
  for(let gi=0;gi*QR_G<n;gi++){const par=new Uint8Array(C);
    for(let i=gi*QR_G;i<Math.min(n,(gi+1)*QR_G);i++){const part=pay.subarray(i*C,(i+1)*C);for(let b=0;b<part.length;b++)par[b]^=part[b];
      const f=new Uint8Array(14+part.length);f.set(qrHead(id,0,QR_G,i,n,pay.length));f.set(part,14);out.push(latin1(f));dataN++}
    if(Math.min(n,(gi+1)*QR_G)-gi*QR_G>1){const f=new Uint8Array(14+C);f.set(qrHead(id,1,QR_G,gi,n,pay.length));f.set(par,14);out.push(latin1(f))}}
  return{id,chunks:out,bytes:pay.length,data:dataN};
}
function drawQr(canvas,text){
  const q=qrcode(0,'L');q.addData(text,'Byte');q.make();
  const n=q.getModuleCount(),m=4,size=canvas.width,cell=size/(n+m*2),x=canvas.getContext('2d');

  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(Math.floor((c+m)*cell),Math.floor((r+m)*cell),Math.ceil(cell),Math.ceil(cell));

function qrMeta(){const mm=$('#qrMeta');if(!mm)return;const secs=Math.ceil(QS.chunks.length/QS.fps);

async function startQrSend(){

function restartQrTimer(){clearInterval(QS.timer);QS.timer=setInterval(()=>{if(!QS.paused){QS.i=(QS.i+1)%QS.chunks.length;tickQr()}},1000/QS.fps)}

let SC={stream:null,raf:0,id:-1,n:0,total:0,g:8,C:0,data:null,par:null,rec:0,busy:false,last:0};
function loadScript(src){return new Promise((res,rej)=>{if(window.jsQR)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function openQrScan(){
  openModal(`<h2>QRコードを読み取る</h2><div class="scanbox"><video id="scanV" playsinline muted></video><div class="scanframe"></div></div>
    <div class="scanbar"><div id="scanBar"></div></div><p class="hint" id="scanMsg">カメラを起動しています…</p>
    <div class="acts"><button class="btn" data-close>閉じる</button></div>`);

function stopScan(){cancelAnimationFrame(SC.raf);if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}}
async function onScanRaw(r){const b=r.binaryData;if(b&&b.length>14&&b[0]===0x57&&b[1]===0x32)return onScanBin(Uint8Array.from(b));if(r.data)return onScan(r.data)}
async function onScan(t){

}
function scRecover(){const{n,g,C,data,par}=SC;let got=false;
  for(const[gi,p]of par){const a=gi*g,b=Math.min(n,a+g);let miss=-1,cnt=0;for(let i=a;i<b;i++)if(!data.has(i)){miss=i;cnt++}
    if(cnt!==1)continue;const x=p.slice();for(let i=a;i<b;i++){if(i===miss)continue;const d=data.get(i);for(let k=0;k<d.length;k++)x[k]^=d[k]}

  return got}

  const msg=$('#scanMsg');if(msg)msg.textContent=`受け取り中… ${got} / ${n}（残り ${n-got}枚${SC.rec?`・${SC.rec}枚を自動復元`:''}）`;
  if(got===n){SC.busy=true;stopScan();const all=new Uint8Array(total);let o=0;for(let i=0;i<n;i++){const d=SC.data.get(i);all.set(d.subarray(0,Math.min(d.length,total-o)),o);o+=d.length}
    try{await applyTransfer(all)}catch(e){toast('データを組み立てられませんでした。もう一度読み取ってください')}SC.busy=false}
}
async function applyTransfer(code){
  let buf,z;if(typeof code==='string'){buf=unb64u(code.slice(1));z=code[0]==='z'}else{z=code[0]===0x7a;buf=code.subarray(1)}

  S=normalize(head.state);let o=4+hl;

  for(const mt of head.imgs){const b=new Blob([buf.subarray(o,o+mt.len)],{type:mt.type});o+=mt.len;await DB.put(mt.k,b);try{IMG[mt.k]=await blobToImg(b)}catch(e){}}

cv.addEventListener('pointerdown',e=>{DOWN={x:e.clientX,y:e.clientY,moved:false};const t=dragTarget();if(!t)return;const{W,H}=dims();const p=cvPt(e);
  if(t==='avarea'){const L=areaLine(W,H);if(Math.abs((L.v?p.x:p.y)-L.p)>Math.min(W,H)*0.05)return;e.preventDefault();cv.setPointerCapture?.(e.pointerId);PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});PMODE='avarea';return}
  e.preventDefault();cv.setPointerCapture?.(e.pointerId);PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  PMODE='move';
  if(t==='avatar'&&PTR.size===1){const b=avBox(W,H);if(b){
    if(Math.hypot(p.x-b.hx,p.y-b.hy)<b.hr*2.2){PMODE='rotate';ROT0={a0:Math.atan2(p.y-b.cy,p.x-b.cx),r0:S.avatar.rot||0}}
    else if(b.hco.some(c=>Math.hypot(p.x-c.x,p.y-c.y)<b.hr*2.4)){PMODE='scale';SC0={d:Math.max(1,Math.hypot(p.x-b.cx,p.y-b.cy)),s:S.avatar.scale}}}}
  if(PTR.size===2&&t!=='avarea'){const[a,b]=[...PTR.values()];const P=dragProps(t);pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),s:P.o[P.s],ang:Math.atan2(b.y-a.y,b.x-a.x),r:S.avatar.rot||0}}});
cv.addEventListener('pointermove',e=>{
  if(DOWN&&Math.hypot(e.clientX-DOWN.x,e.clientY-DOWN.y)>6)DOWN.moved=true;
  if(!PTR.has(e.pointerId))return;const t=dragTarget();if(!t)return;
  const prev=PTR.get(e.pointerId);PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const{W,H}=dims();const p=cvPt(e);
  if(PMODE==='avarea'){const m=S.layout.mode;let a=m==='land-right'?1-p.x/W:m==='land-left'?p.x/W:m==='port-bottom'?1-p.y/H:p.y/H;S.layout.avatar=Math.round(clamp(a,0.15,0.7)*1000)/10;const el=document.getElementById('r-layout-avatar');if(el){el.value=S.layout.avatar;const o=el.parentElement.querySelector('output');if(o)o.textContent=S.layout.avatar+'%'}schedule();return}
  const P=dragProps(t);
  if(PTR.size===1&&PMODE==='rotate'&&ROT0){const b=avBox(W,H);let r=ROT0.r0+(Math.atan2(p.y-b.cy,p.x-b.cx)-ROT0.a0)*180/Math.PI;if(e.shiftKey)r=Math.round(r/15)*15;S.avatar.rot=normRot(r)}
  else if(PTR.size===1&&PMODE==='scale'&&SC0){const b=avBox(W,H);S.avatar.scale=clamp(SC0.s*Math.hypot(p.x-b.cx,p.y-b.cy)/SC0.d,5,400)}
  else if(PTR.size===1){const k=cvScale();P.o[P.x]=clamp(P.o[P.x]+(e.clientX-prev.x)*k/W*100,P.lim[0],P.lim[1]);P.o[P.y]=clamp(P.o[P.y]+(e.clientY-prev.y)*k/H*100,P.lim[0],P.lim[1])}
  else if(PTR.size===2&&pinch0){const[a,b]=[...PTR.values()];P.o[P.s]=clamp(pinch0.s*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinch0.d),P.sl[0],P.sl[1]);
    if(t==='avatar')S.avatar.rot=normRot(pinch0.r+(Math.atan2(b.y-a.y,b.x-a.x)-pinch0.ang)*180/Math.PI)}
  schedule();
});
cv.addEventListener('click',e=>{
  if(DOWN&&DOWN.moved)return;const{W,H}=dims();const p=cvPt(e);const t=dragTarget();
  if(t==='avatar'){const b=avBox(W,H);if(b){const lx=(p.x-b.cx)*Math.cos(-b.a)-(p.y-b.cy)*Math.sin(-b.a),ly=(p.x-b.cx)*Math.sin(-b.a)+(p.y-b.cy)*Math.cos(-b.a);if(Math.abs(lx)<=b.w/2&&Math.abs(ly)<=b.h/2)return}}
  if(t==='avarea'){const L=areaLine(W,H);if(Math.abs((L.v?p.x:p.y)-L.p)<Math.min(W,H)*0.05)return}
  const hit=(LAST.hits||[]).find(h=>p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h);if(!hit)return;
  editFromPreview(hit);
});
function editFromPreview(hit){
  if(hit.type==='day'){TAB='sched';renderTab();const el=body.querySelector(`.day[data-day="${hit.i}"]`);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1500);const inp=el.querySelector('input[type=text]');if(inp&&!mqMobile.matches)setTimeout(()=>inp.focus({preventScroll:true}),350)}toast(`${dayLabel(hit.i)}の予定を編集できます`)}
  else if(hit.type==='head'){TAB='layout';renderTab();const g=document.getElementById('headGrp');if(g){g.scrollIntoView({block:'start',behavior:'smooth'});g.parentElement.classList.add('flash');setTimeout(()=>g.parentElement.classList.remove('flash'),1500)}toast('タイトルと文字の大きさを編集できます')}
  else if(hit.type==='foot'){TAB='settings';renderTab();const n=document.getElementById('s-nja');if(n){n.scrollIntoView({block:'center',behavior:'smooth'});n.closest('.grp').classList.add('flash');setTimeout(()=>n.closest('.grp').classList.remove('flash'),1500)}toast('注意書きを編集できます')}
}
document.addEventListener('keydown',e=>{
  if(dragTarget()!=='avatar'||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')&&document.activeElement.type!=='range'&&document.activeElement.type!=='checkbox')return;
  if(document.activeElement?.type==='range')return;
  const st=e.shiftKey?10:1;const m={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(m){e.preventDefault();nudgeAv(m[0],m[1]);return}
  if(e.key==='['){e.preventDefault();rotAv(e.shiftKey?-15:-1)}if(e.key===']'){e.preventDefault();rotAv(e.shiftKey?15:1)}
});
const ptrEnd=e=>{if(!PTR.has(e.pointerId))return;PTR.delete(e.pointerId);if(!PTR.size){if(PMODE==='avarea'&&S.img.avatar&&S.avatar.autofit)fitAvatar();PMODE='move';ROT0=null;SC0=null}if(PTR.size<2)pinch0=null;if(!PTR.size){save();syncDragInputs()}};
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{const t=dragTarget();if(!t||t==='avarea')return;e.preventDefault();const P=dragProps(t);P.o[P.s]=clamp(P.o[P.s]*Math.exp(-e.deltaY*0.0012),P.sl[0],P.sl[1]);schedule();save();syncDragInputs()},{passive:false});

/* =========================================================
   boot
   ========================================================= */
(async function boot(){
  renderTab();schedule();HIST.last=snapStr();
  await loadImages();schedule();if(TAB==='design'||TAB==='avatar'||TAB==='bg')renderTab();
  await checkImport();
  if('serviceWorker'in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
</script>
